name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  # Not CARGO_NET_OFFLINE=true: ort-sys reads it as "skip the ONNX Runtime download" and then
  # fails to link. Registry access is blocked by --offline on every cargo command below instead.
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          rustup default 1.90.0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev meson ninja-build
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # ort-sys downloads a hash-pinned ONNX Runtime at build time; keep it next to the
          # cached target dir so a cache hit never points at a missing library.
          cache-directories: ~/.cache/ort.pyke.io
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify pinned toolchain
        run: |
          rustc --version | grep -Eq '^rustc 1\.90\.0 '
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: |
          # deep_filter_fork is a vendored path dependency (an implicit workspace member) whose
          # `dataset` feature needs hdf5/hound, which are not declared; --all-features cannot build it.
          cargo clippy --workspace --exclude deep_filter_fork --all-targets --all-features --locked --offline -- -D warnings
      - name: Build PipeWire helper
        run: |
          meson setup platform/linux/helper/build platform/linux/helper
          ninja -C platform/linux/helper/build
      - name: Build workspace
        run: cargo build --workspace --locked --offline
      - name: Test workspace
        run: cargo test --workspace --locked --offline
      - name: Verify offline gate
        run: scripts/check-offline.sh
