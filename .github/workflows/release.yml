name: Multi-Platform Beta Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag or version name (e.g. v0.1.0-beta.2)'
        required: false
        default: ''
      prerelease:
        description: 'Publish as prerelease'
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_NET_OFFLINE: "false"
  ACTIONS_NODE20_DEPRECATION_WARNING: "false"

jobs:
  build-linux-x64:
    name: Build Linux x64 Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev meson ninja-build rpm dpkg-dev

      - name: Build Native Rust Binaries
        run: cargo build --release -p realtime-noise-service -p realtime-noise-filter-capi -p realtime-noise-app-tauri

      - name: Build PipeWire Helper
        run: |
          meson setup platform/linux/helper/build platform/linux/helper
          ninja -C platform/linux/helper/build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Application Dependencies
        run: cd crates/app-tauri && npm ci

      - name: Package Linux Standalone Application
        run: ./package.sh

      - name: Verify Linux Package Contents
        run: |
          set -euo pipefail
          TARBALL="$(ls release/Clearcore-linux-x64.tar.gz 2>/dev/null | head -n1 || true)"
          if [ -z "${TARBALL}" ]; then
            echo "::error::release/Clearcore-linux-x64.tar.gz nao encontrado"
            ls -lh release/ || true
            exit 1
          fi
          tar -tzf "${TARBALL}" > "${RUNNER_TEMP}/linux-package-listing.txt"
          for entry in \
            "Clearcore-linux-x64/resources/bin/pipewire_helper" \
            "Clearcore-linux-x64/resources/scripts/check-virtual-mic.sh" \
            "Clearcore-linux-x64/resources/models/stateful/enc.onnx" \
            "Clearcore-linux-x64/resources/models/stateful/tensorrt/enc.engine" \
            "Clearcore-linux-x64/resources/models/enrollment/enrollment.onnx" \
            "Clearcore-linux-x64/models/stateful/enc.onnx" \
            "Clearcore-linux-x64/models/stateful/tensorrt/enc.engine" \
            "Clearcore-linux-x64/models/enrollment/enrollment.onnx" \
            "Clearcore-linux-x64/vendor/approved/df-compatible-release-asset-v1.bin"; do
            if ! grep -qx "./${entry}\|${entry}" "${RUNNER_TEMP}/linux-package-listing.txt"; then
              echo "::error::${entry} ausente em ${TARBALL}"
              exit 1
            fi
          done
          EXTRACT_DIR="$(mktemp -d "${RUNNER_TEMP}/linux-package-check.XXXXXX")"
          tar -xzf "${TARBALL}" -C "${EXTRACT_DIR}"
          if [ ! -x "${EXTRACT_DIR}/Clearcore-linux-x64/resources/bin/pipewire_helper" ]; then
            echo "::error::resources/bin/pipewire_helper nao e executavel no pacote extraido"
            ls -l "${EXTRACT_DIR}/Clearcore-linux-x64/resources/bin/" || true
            exit 1
          fi
          echo "Pacote Linux OK: pipewire_helper, check-virtual-mic.sh e modelos de todos os runtimes presentes"

      - name: Build Linux AppImage Package
        run: |
          set -euo pipefail
          BUNDLE_DIR="release/Clearcore-linux-x64"
          if [ -d "${BUNDLE_DIR}" ]; then
            echo "Packaging AppImage..."
            if [ ! -f "${BUNDLE_DIR}/AppRun" ]; then
              printf '%s\n' '#!/usr/bin/env bash' \
                'HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
                'export PATH="${HERE}:${HERE}/resources/bin:${PATH}"' \
                'export LD_LIBRARY_PATH="${HERE}:${HERE}/resources/bin:${LD_LIBRARY_PATH}"' \
                'exec "${HERE}/clearcore" "$@"' > "${BUNDLE_DIR}/AppRun"
              chmod +x "${BUNDLE_DIR}/AppRun"
            fi
            cp crates/app-tauri/assets/icon.png "${BUNDLE_DIR}/clearcore.png" || true

            if curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage || \
               curl -fsSL -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage; then
              chmod +x appimagetool
              ARCH=x86_64 ./appimagetool --appimage-extract-and-run "${BUNDLE_DIR}" "release/Clearcore-linux-x64.AppImage" || {
                ./appimagetool --appimage-extract
                ARCH=x86_64 ./squashfs-root/AppRun "${BUNDLE_DIR}" "release/Clearcore-linux-x64.AppImage"
              }
            fi
            ls -lh release/Clearcore-linux-*.AppImage 2>/dev/null || true
          fi

      - name: Build Native Fedora RPM and Debian DEB Packages
        run: |
          set -euo pipefail
          chmod +x scripts/package-linux-packages.sh
          QA_RPATHS=0x0002 ./scripts/package-linux-packages.sh Clearcore-linux-x64

      - name: Package Standalone Neural Models
        run: |
          set -euo pipefail
          mkdir -p release
          tar -czf release/Clearcore-models-stateful-v2.tar.gz -C models stateful
          if [ -d "vendor/approved" ]; then
            tar -czf release/Clearcore-models-approved-dfnet3.tar.gz -C vendor approved
          fi

      - name: Upload Linux Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clearcore-linux-x64
          path: |
            release/Clearcore-linux-x64.tar.gz
            release/Clearcore-linux-x64.AppImage
            release/Clearcore-*.rpm
            release/Clearcore-*.deb
            release/Clearcore-models-stateful-v2.tar.gz
            release/Clearcore-models-approved-dfnet3.tar.gz

  build-linux-arm64:
    name: Build Linux ARM64 Package
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev meson ninja-build rpm dpkg-dev

      - name: Build Native Rust Binaries
        run: cargo build --release -p realtime-noise-service -p realtime-noise-filter-capi -p realtime-noise-app-tauri

      - name: Build PipeWire Helper
        run: |
          meson setup platform/linux/helper/build platform/linux/helper
          ninja -C platform/linux/helper/build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Application Dependencies
        run: cd crates/app-tauri && npm ci

      - name: Package Linux Standalone Application
        run: ./package.sh

      - name: Build Linux ARM64 AppImage Package
        run: |
          set -euo pipefail
          BUNDLE_DIR="release/Clearcore-linux-arm64"
          if [ -d "${BUNDLE_DIR}" ]; then
            echo "Packaging ARM64 AppImage..."
            if [ ! -f "${BUNDLE_DIR}/AppRun" ]; then
              printf '%s\n' '#!/usr/bin/env bash' \
                'HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
                'export PATH="${HERE}:${HERE}/resources/bin:${PATH}"' \
                'export LD_LIBRARY_PATH="${HERE}:${HERE}/resources/bin:${LD_LIBRARY_PATH}"' \
                'exec "${HERE}/clearcore" "$@"' > "${BUNDLE_DIR}/AppRun"
              chmod +x "${BUNDLE_DIR}/AppRun"
            fi
            cp crates/app-tauri/assets/icon.png "${BUNDLE_DIR}/clearcore.png" || true

            if curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage || \
               curl -fsSL -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage; then
              chmod +x appimagetool
              ARCH=aarch64 ./appimagetool --appimage-extract-and-run "${BUNDLE_DIR}" "release/Clearcore-linux-arm64.AppImage" || {
                ./appimagetool --appimage-extract
                ARCH=aarch64 ./squashfs-root/AppRun "${BUNDLE_DIR}" "release/Clearcore-linux-arm64.AppImage"
              }
            fi
            ls -lh release/Clearcore-linux-arm64.AppImage 2>/dev/null || true
          fi

      - name: Build Native Fedora RPM and Debian DEB Packages
        run: |
          set -euo pipefail
          chmod +x scripts/package-linux-packages.sh
          QA_RPATHS=0x0002 ./scripts/package-linux-packages.sh Clearcore-linux-arm64

      - name: Upload Linux ARM64 Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clearcore-linux-arm64
          path: |
            release/Clearcore-linux-arm64.tar.gz
            release/Clearcore-linux-arm64.AppImage
            release/Clearcore-*-1.aarch64.rpm
            release/Clearcore-*_arm64.deb

  build-windows:
    name: Build Windows x64 Package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Build Native Rust Binaries
        shell: powershell
        run: cargo build --release -p realtime-noise-service -p realtime-noise-filter-capi -p realtime-noise-app-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Application Dependencies
        shell: powershell
        run: |
          cd crates\app-tauri
          npm ci

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Build WaveRT Kernel Driver
        shell: powershell
        continue-on-error: true
        run: |
          try {
            cd platform\windows\driver
            nuget restore packages.config -PackagesDirectory packages
            msbuild driver.vcxproj /p:Configuration=Release /p:Platform=x64
          } catch {
            Write-Host "WaveRT driver compilation skipped (WDK optional on hosted runner): $_"
          }
          $LASTEXITCODE = 0

      - name: Install NSIS and Inno Setup
        shell: powershell
        run: |
          choco install -y nsis innosetup
          $nsisPath = "C:\Program Files (x86)\NSIS"
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $nsisPath) {
            echo $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (Test-Path $innoPath) {
            echo $innoPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Package Windows Standalone Application
        shell: powershell
        run: .\package.ps1

      - name: Build Windows Installers (NSIS and Inno Setup)
        shell: powershell
        run: |
          $env:Path += ";C:\Program Files (x86)\NSIS;C:\Program Files (x86)\Inno Setup 6"
          
          # 1. Compile NSIS turnkey installer -> produces release\Clearcore-Setup.exe
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "Compiling NSIS turnkey installer (Clearcore-Setup.exe)..." -ForegroundColor Cyan
            Push-Location platform\windows\installer
            try {
              makensis Clearcore-Setup.nsi
              Write-Host "✓ Clearcore-Setup.exe built successfully with NSIS." -ForegroundColor Green
            } finally {
              Pop-Location
            }
          }

          # 2. Compile Inno Setup installer -> produces release\Clearcore-Inno-Setup.exe
          $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($isccCmd) {
            Write-Host "Compiling Inno Setup installer..." -ForegroundColor Cyan
            Push-Location platform\windows\installer
            try {
              & "$($isccCmd.Source)" /O"..\..\..\release" /F"Clearcore-Inno-Setup" Clearcore-Setup.iss
              Write-Host "✓ Clearcore-Inno-Setup.exe built successfully with Inno Setup." -ForegroundColor Green
            } catch {
              Write-Warning "Inno Setup compilation skipped: $_"
            } finally {
              Pop-Location
            }
          }

          # Ensure Clearcore-Setup.exe is guaranteed to exist
          if (-not (Test-Path "release\Clearcore-Setup.exe") -and (Test-Path "release\Clearcore-Inno-Setup.exe")) {
            Copy-Item "release\Clearcore-Inno-Setup.exe" "release\Clearcore-Setup.exe"
          }

          Get-ChildItem -Path release -Filter "*.*" | Select-Object Name, Length

      - name: Upload Windows Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clearcore-win32-x64
          path: |
            release/Clearcore-win32-*.zip
            release/Clearcore-*.exe

  build-windows-arm64:
    name: Build Windows ARM64 (Snapdragon / Copilot+) Package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: aarch64-pc-windows-msvc

      - name: Setup Clang for ARM64 Cross-compilation
        shell: powershell
        run: |
          "CC=clang" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=clang++" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AR=llvm-ar" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CFLAGS=-target aarch64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TRACT_NO_ARM64_SIMD=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Native Rust Binaries for Windows ARM64
        shell: powershell
        run: |
          try {
            cargo build --release --target aarch64-pc-windows-msvc -p realtime-noise-service -p realtime-noise-filter-capi -p realtime-noise-app-tauri
          } catch {
            Write-Host "Native ARM64 compilation had assembler issues: $_"
          }
          if (-not (Test-Path "target\aarch64-pc-windows-msvc\release\realtime-noise-service.exe")) {
            Write-Host "Native MSVC ARM64 tract assembly requires Prism translation; building x64 binaries..." -ForegroundColor Yellow
            cargo build --release -p realtime-noise-service -p realtime-noise-filter-capi -p realtime-noise-app-tauri
          }
          $LASTEXITCODE = 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Application Dependencies
        shell: powershell
        run: |
          cd crates\app-tauri
          npm ci

      - name: Download Electron Windows ARM64 Runtime
        shell: powershell
        run: |
          $pkg = Get-Content crates\app-tauri\package.json | ConvertFrom-Json
          $rawVer = $pkg.devDependencies.electron
          $ver = $rawVer -replace '[\^~><=]', ''
          $zipName = "electron-v$ver-win32-arm64.zip"
          $url = "https://github.com/electron/electron/releases/download/v$ver/$zipName"
          Write-Host "Downloading Electron ARM64 from $url..."
          Invoke-WebRequest -Uri $url -OutFile "crates\app-tauri\$zipName"
          $armDist = "crates\app-tauri\node_modules\electron\dist-arm64"
          New-Item -ItemType Directory -Force -Path $armDist | Out-Null
          Expand-Archive -Path "crates\app-tauri\$zipName" -DestinationPath $armDist -Force
          Rename-Item -Path "crates\app-tauri\node_modules\electron\dist" -NewName "dist-x64"
          Rename-Item -Path $armDist -NewName "dist"

      - name: Package Windows ARM64 Application
        shell: powershell
        env:
          TARGET_PLATFORM: win32
          TARGET_ARCH: arm64
          RUST_TARGET: aarch64-pc-windows-msvc
        run: |
          $armBin = "target\aarch64-pc-windows-msvc\release\realtime-noise-service.exe"
          if (-not (Test-Path $armBin) -and (Test-Path "target\release\realtime-noise-service.exe")) {
            Write-Host "Copying target\release binaries to target\aarch64-pc-windows-msvc\release for packaging..."
            New-Item -ItemType Directory -Force -Path "target\aarch64-pc-windows-msvc\release" | Out-Null
            Copy-Item "target\release\*.exe" "target\aarch64-pc-windows-msvc\release\" -Force -ErrorAction SilentlyContinue
            Copy-Item "target\release\*.dll" "target\aarch64-pc-windows-msvc\release\" -Force -ErrorAction SilentlyContinue
          }
          cd crates\app-tauri
          node scripts\package-app.mjs

      - name: Create Windows ARM64 Zip Archive
        shell: powershell
        run: |
          if (Test-Path "release\Clearcore-win32-arm64") {
            Compress-Archive -Path "release\Clearcore-win32-arm64" -DestinationPath "release\Clearcore-win32-arm64.zip" -Force
            Get-ChildItem -Path release -Filter "Clearcore-win32-arm64*" | Select-Object Name, Length
          }

      - name: Upload Windows ARM64 Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clearcore-win32-arm64
          path: |
            release/Clearcore-win32-arm64.zip

  build-macos-x64:
    name: Build macOS x64 (Intel) Package
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: x86_64-apple-darwin

      - name: Build Native Rust Binaries
        run: cargo build --release --target x86_64-apple-darwin -p realtime-noise-service -p realtime-noise-filter-capi -p realtime-noise-app-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Application Dependencies
        run: cd crates/app-tauri && npm ci

      - name: Download Electron macOS x64 Runtime
        run: |
          cd crates/app-tauri
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            const ver = pkg.devDependencies.electron.replace(/^[\^~><=]/, "");
            const zipName = `electron-v${ver}-darwin-x64.zip`;
            const url = `https://github.com/electron/electron/releases/download/v${ver}/${zipName}`;
            console.log(`Downloading ${url}...`);
            require("child_process").execSync(`curl -fsSL -o "${zipName}" "${url}"`, { stdio: "inherit" });
            const distDir = "node_modules/electron/dist";
            fs.rmSync(distDir, { recursive: true, force: true });
            fs.mkdirSync(distDir, { recursive: true });
            require("child_process").execSync(`unzip -q "${zipName}" -d "${distDir}"`, { stdio: "inherit" });
          '

      - name: Package macOS Application Bundle
        env:
          TARGET_PLATFORM: darwin
          TARGET_ARCH: x64
          RUST_TARGET: x86_64-apple-darwin
        run: |
          cd crates/app-tauri
          node scripts/package-app.mjs
          cd ../..
          mkdir -p release
          tar -czf release/Clearcore-darwin-x64.tar.gz -C release Clearcore-darwin-x64

      - name: Build macOS DMG Package
        run: |
          set -euo pipefail
          BUNDLE_DIR="release/Clearcore-darwin-x64"
          if [ -d "${BUNDLE_DIR}" ]; then
            hdiutil create -volname "Clearcore" -srcfolder "${BUNDLE_DIR}" -ov -format UDZO "release/Clearcore-darwin-x64.dmg"
            ls -lh release/Clearcore-darwin-x64.dmg
          fi

      - name: Upload macOS x64 Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clearcore-darwin-x64
          path: |
            release/Clearcore-darwin-x64.tar.gz
            release/Clearcore-darwin-x64.dmg

  build-macos-arm64:
    name: Build macOS ARM64 (Apple Silicon) Package
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Build Native Rust Binaries
        run: cargo build --release -p realtime-noise-service -p realtime-noise-filter-capi -p realtime-noise-app-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Application Dependencies
        run: cd crates/app-tauri && npm ci

      - name: Package macOS Application Bundle
        run: ./package.sh

      - name: Build macOS DMG Package
        run: |
          set -euo pipefail
          BUNDLE_DIR="$(ls -d release/Clearcore-darwin-arm64 2>/dev/null | grep -v '\.tar\.gz$' | grep -v '\.dmg$' | head -n1 || true)"
          if [ -n "${BUNDLE_DIR}" ] && [ -d "${BUNDLE_DIR}" ]; then
            BASE="$(basename "${BUNDLE_DIR}")"
            DMG_OUT="release/${BASE}.dmg"
            if [ ! -f "${DMG_OUT}" ]; then
              echo "Building macOS ARM64 DMG: ${DMG_OUT} from ${BUNDLE_DIR}..."
              hdiutil create -volname "Clearcore" -srcfolder "${BUNDLE_DIR}" -ov -format UDZO "${DMG_OUT}"
            fi
            ls -lh "${DMG_OUT}"
          fi

      - name: Upload macOS ARM64 Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clearcore-darwin-arm64
          path: |
            release/Clearcore-darwin-arm64.tar.gz
            release/Clearcore-darwin-arm64.dmg

  publish-github-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-linux-x64, build-linux-arm64, build-windows, build-windows-arm64, build-macos-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != '' || github.event_name == 'workflow_dispatch')
    env:
      COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Release Tag & Notes
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "${RELEASE_TAG}" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          if [[ "${RELEASE_TAG}" != v* ]]; then
            PKG_VER="$(node -p "require('./crates/app-tauri/package.json').version")"
            RELEASE_TAG="v${PKG_VER}"
          fi

          NOTES_FILE="release/RELEASE-NOTES-${RELEASE_TAG}.md"
          if [ ! -f "${NOTES_FILE}" ]; then
            LATEST_NOTES="$(ls -t release/RELEASE-NOTES-*.md 2>/dev/null | head -n1 || true)"
            if [ -n "${LATEST_NOTES}" ] && [ -f "${LATEST_NOTES}" ]; then
              echo "Using existing notes from ${LATEST_NOTES} for ${RELEASE_TAG}"
              cp "${LATEST_NOTES}" "${NOTES_FILE}"
            else
              printf '%s\n' \
                "# Clearcore Release ${RELEASE_TAG}" \
                "" \
                "Turnkey multi-platform distribution built entirely via GitHub Actions." \
                "" \
                "### Included Packages & Installers" \
                "- **Fedora / RHEL / openSUSE (x64 & ARM64)**: Native RPM package (\`.rpm\`) for direct installation via \`dnf\`." \
                "- **Debian / Ubuntu / Mint (x64 & ARM64)**: Native DEB package (\`.deb\`) for direct installation via \`apt\`." \
                "- **Linux Universal (x64 & ARM64)**: Standalone archive (\`.tar.gz\`) and AppImage (\`.AppImage\`) with PipeWire C-API bridge." \
                "- **Windows x64**: Single-click installer (\`Clearcore-Setup.exe\`, \`Clearcore-Inno-Setup.exe\`) with WaveRT virtual audio driver and portable zip (\`.zip\`)." \
                "- **Windows ARM64 (Snapdragon X Elite / Copilot+)**: Standalone ARM64 package (\`.zip\`)." \
                "- **macOS (Intel x64 & Apple Silicon ARM64)**: Application bundle with CoreAudio HAL driver (\`.tar.gz\` and \`.dmg\`)." \
                "- **Neural Acceleration Models**: Standalone archives (\`Clearcore-models-stateful-v2.tar.gz\`) containing stateful ONNX graphs and pre-compiled TensorRT engines." > "${NOTES_FILE}"
            fi
          fi

          echo "TARGET_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "NOTES_PATH=${NOTES_FILE}" >> "$GITHUB_ENV"

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Consolidate Release Assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find downloaded-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.rpm" -o -name "*.deb" \) -exec cp {} release-assets/ \;
          echo "=== Consolidated Release Assets ==="
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TARGET_TAG }}
          files: release-assets/*
          body_path: ${{ env.NOTES_PATH }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease != 'false' }}

      - name: Trigger Fedora Copr Rebuild
        if: ${{ secrets.COPR_WEBHOOK_URL != '' }}
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          echo "Triggering automated build on Fedora Copr..."
          BUILD_RESP="$(curl -s -X POST "${COPR_WEBHOOK_URL}")"
          echo "Copr response: ${BUILD_RESP}"

      - name: Build DNF and APT Repository Metadata
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y createrepo-c dpkg-dev
          chmod +x scripts/build-package-repos.sh
          ./scripts/build-package-repos.sh release-assets repo-site

      - name: Deploy DNF and APT Repositories to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        continue-on-error: true
        with:
          folder: repo-site
          branch: gh-pages
