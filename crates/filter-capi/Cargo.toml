[package]
name = "realtime-noise-filter-capi"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[lib]
name = "clearcore_filter"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
deep_filter = { path = "../../vendor/crates/deep_filter", package = "deep_filter_fork", default-features = false, features = ["transforms"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"] }
realtime-noise-contracts = { path = "../contracts" }
realtime-noise-model = { path = "../model", features = ["ort", "tract"] }
realtime-noise-runtime-openvino = { path = "../runtime-openvino" }
realtime-noise-service = { path = "../service" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
serde_json = { version = "=1.0.145", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
studio-dsp = { path = "../studio-dsp" }
tar = { version = "=0.4.46", default-features = false }

[dev-dependencies]
tempfile = { version = "=3.23.0", default-features = false }

[lints.rust]
unsafe_code = "allow"
