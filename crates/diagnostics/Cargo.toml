[package]
name = "realtime-noise-diagnostics"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
realtime-noise-contracts = { path = "../contracts" }
realtime-noise-ipc = { path = "../ipc" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.145", default-features = false, features = ["std"] }

[dev-dependencies]
realtime-noise-model = { path = "../model" }
tempfile = { version = "=3.23.0", default-features = false }

[lints]
workspace = true
