[package]
name = "realtime-noise-runtime-tensorrt"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
realtime-noise-contracts = { path = "../contracts" }
realtime-noise-model = { path = "../model" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.189", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[build-dependencies]
cc = { version = "=1.5.1", default-features = false }

[lints.rust]
unsafe_code = "allow"

