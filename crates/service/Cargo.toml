[package]
name = "realtime-noise-service"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
realtime-noise-accelerators = { path = "../accelerators" }
realtime-noise-contracts = { path = "../contracts" }
realtime-noise-engine = { path = "../engine" }
realtime-noise-ipc = { path = "../ipc" }
realtime-noise-model = { path = "../model" }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
realtime-noise-supervisor = { path = "../supervisor" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.145", default-features = false, features = ["std"] }
studio-dsp = { path = "../studio-dsp" }

[features]
tract = ["realtime-noise-engine/tract", "realtime-noise-supervisor/tract", "realtime-noise-accelerators/tract"]


[dev-dependencies]
tempfile = { version = "=3.23.0", default-features = false }

[lints]
workspace = true
