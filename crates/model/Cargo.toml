[package]
name = "realtime-noise-model"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
tract = [
    "dep:deep_filter",
    "dep:ndarray",
    "dep:tempfile",
    "dep:tract-core",
    "dep:tract-hir",
    "dep:tract-onnx",
    "dep:tract-pulse",
]

[dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", tag = "v0.5.6", package = "deep_filter", default-features = false, features = ["tract"], optional = true }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
ndarray = { version = "=0.15.6", default-features = false, features = ["std"], optional = true }
realtime-noise-contracts = { path = "../contracts" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.145", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tar = { version = "=0.4.46", default-features = false }
tempfile = { version = "=3.23.0", default-features = false, optional = true }
tract-core = { version = "=0.19.16", default-features = false, optional = true }
tract-hir = { version = "=0.19.16", default-features = false, optional = true }
tract-onnx = { version = "=0.19.16", default-features = false, optional = true }
tract-pulse = { version = "=0.19.16", default-features = false, optional = true }

[lints]
workspace = true
