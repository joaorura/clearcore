[package]
name = "realtime-noise-tools"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
tract = ["realtime-noise-model/tract"]

[dependencies]
realtime-noise-contracts = { path = "../contracts" }
realtime-noise-model = { path = "../model", default-features = false, features = ["tract"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.145", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

# stats_alloc = { version = "=0.1.10", default-features = false, optional = true }
# The above dependency is required for per-hop allocation instrumentation but is not available
# in the offline cache. It must be added in a separate network-enabled dependency bootstrap step
# (without project mount) per the task requirements. Once fetched, enable the alloc_instrumentation
# feature and uncomment the dependency.

[lints]
workspace = true
